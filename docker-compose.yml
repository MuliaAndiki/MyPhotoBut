name: myphotobut-stack

services:
  postgres:
    image: postgres:17-alpine
    container_name: myphotobut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-myphotobut_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-myphotobut_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myphotobut-network

volumes:
  pgdata:

networks:
  myphotobut-network:
    driver: bridge
